name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_jupyter:
        description: Run the real Python/Jupyter integration
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run publint
      - run: pnpm run pack:verify

  portable:
    name: ${{ matrix.os }} / Node 22.19
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  real-jupyter:
    if: github.event_name == 'workflow_dispatch' && inputs.real_jupyter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'jupyter_client==8.9.1' 'ipykernel==7.3.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/notebook-kernel-jupyter/tests/connection.spec.ts -t 'executes and inspects through a real Jupyter kernel'
