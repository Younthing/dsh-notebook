# Install the standalone Notebook capability into any DeepSeek Harness profile.
- insert:
    - id: notebook-core
      name: '@younthing/dsh-notebook-core'

    - id: notebook-environment-uv
      name: '@younthing/dsh-notebook-environment-uv'

    - id: notebook-kernel-jupyter
      name: '@younthing/dsh-notebook-kernel-jupyter'

    - id: notebook-remote
      name: '@younthing/dsh-notebook-remote'

    - id: tool-notebook
      name: '@younthing/dsh-tool-notebook'

    - id: ui-notebook
      name: '@younthing/dsh-client-ui-notebook'
